

<template>
    <lightning-card
        title="Supplier Management"
        icon-name="standard:account">

        <!-- Botão para abrir o formulário -->
        <div class="slds-p-around_medium">
            <div class="slds-m-bottom_medium">
                <lightning-button
                    label="Novo Fornecedor"
                    icon-name="utility:add"
                    variant="brand"
                    onclick={handleNewSupplier}>
                </lightning-button>
            </div>

            <!-- Formulário de criação -->
            <template lwc:if={showNewSupplierForm}>
                <div class="slds-p-around_medium slds-border_bottom">
                    <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                        Novo Fornecedor
                    </h2>

                    <lightning-record-edit-form
                        object-api-name="SuppLier__c"
                        onsuccess={handleSupplierSuccess}
                        onerror={handleSupplierError}>

                        <lightning-messages></lightning-messages>

                        <lightning-input-field
                            field-name="Name">
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Account__c">
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Payment_Status__c">
                        </lightning-input-field>

                        <div class="slds-m-top_medium">
                            <lightning-button
                                type="submit"
                                label="Guardar Fornecedor"
                                variant="brand">
                            </lightning-button>

                            <lightning-button
                                label="Cancelar"
                                onclick={handleCancelNewSupplier}
                                class="slds-m-left_small">
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </template>

            <!-- Pesquisa e filtros -->
            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">

                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                    <lightning-input
                        type="search"
                        label="Pesquisar fornecedor"
                        placeholder="Nome do fornecedor ou conta..."
                        value={searchTerm}
                        onchange={handleSearch}>
                    </lightning-input>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12">
                    <lightning-combobox
                        label="Estado de pagamento"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-12 slds-align-bottom">
                    <lightning-button
                        label="Actualizar"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}
                        disabled={isLoading}>
                    </lightning-button>
                </div>
            </div>

            <!-- Carregamento -->
            <template lwc:if={isLoading}>
                <lightning-spinner
                    alternative-text="A carregar fornecedores"
                    size="medium">
                </lightning-spinner>
            </template>

            <!-- Erro -->
            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-p-around_medium">
                    {errorMessage}
                </div>
            </template>

            <!-- Tabela -->
            <template lwc:if={hasSuppliers}>
                <lightning-datatable
                    key-field="Id"
                    data={suppliers}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>

            <!-- Lista vazia -->
            <template lwc:if={isEmpty}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    Não foram encontrados fornecedores.
                </div>
            </template>

        </div>
    </lightning-card>
</template>
